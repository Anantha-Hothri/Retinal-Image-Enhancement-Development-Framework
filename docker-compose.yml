version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: retinal-enhancement-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/temp:/app/temp
      - ./checkpoints:/app/checkpoints
      - ./models:/app/models
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    restart: unless-stopped
    networks:
      - retinal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retinal-enhancement-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - retinal-network

networks:
  retinal-network:
    driver: bridge

volumes:
  backend_temp:
  checkpoints:

